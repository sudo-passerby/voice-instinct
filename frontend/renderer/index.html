<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src http://127.0.0.1:7860 http://localhost:7860" />
  <style>
    html, body { margin: 0; height: 100%; width: 100%; background: transparent; overflow: hidden; }
    /* Drag anywhere. A drag region gets no mouse events, so there is no hover effect or cursor to set here. */
    #orb { display: block; width: 100vmin; height: 100vmin; margin: auto; -webkit-app-region: drag; }
    /* No usable WebGL2 (orb.js adds .flat): a plain disc whose ring says the state, so Nova is never invisible. */
    #orb.flat { box-sizing: border-box; border-radius: 50%; scale: .72; background: #07091a; border: 3px solid #dbe5ff; }
    #orb.flat[data-mode="speaking"] { border-color: #ffb838; }
    #orb.flat[data-mode="thinking"] { border-style: dotted; }
    #orb.flat[data-mode="resting"] { scale: .4; border-color: #ffb838; }
    #orb.flat[data-ask="1"] { border-color: #ffb838; border-style: double; border-width: 9px; }
    #orb.flat[data-mode="offline"], #orb.flat[data-mode="muted"] { border-color: #6b7080; border-style: dashed; }
  </style>
</head>
<body>
  <canvas id="orb" role="img" aria-label="Nova"></canvas>
  <script src="bundle.js"></script>
</body>
</html>
